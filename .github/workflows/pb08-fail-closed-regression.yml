name: PB-08 Fail-Closed Regression Guard

on:
  push:
    branches: [uav-rebaseline]
    paths:
      - 'ESC_V2/planning/test_pb08_fail_closed_templates.py'
      - 'ESC_V2/planning/verify_pb08_*.py'
      - 'ESC_V2/planning/PB08_*RESULT.template.json'
      - '.github/workflows/pb08-fail-closed-regression.yml'
  pull_request:
    branches: [uav-rebaseline]
    paths:
      - 'ESC_V2/planning/test_pb08_fail_closed_templates.py'
      - 'ESC_V2/planning/verify_pb08_*.py'
      - 'ESC_V2/planning/PB08_*RESULT.template.json'
      - '.github/workflows/pb08-fail-closed-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify blank controlled templates remain rejected
        run: python3 ESC_V2/planning/test_pb08_fail_closed_templates.py
