name: KiCad U1 Verify

on:
  push:
    branches: [uav-rebaseline]
    paths:
      - 'ESC_V2/hardware_u1_scaffold/**'
      - 'ESC_V2/hardware_u1/**'
      - 'ESC_V2/hardware_b1/**'
      - '.github/workflows/kicad-u1-verify.yml'
  pull_request:
    paths:
      - 'ESC_V2/hardware_u1_scaffold/**'
      - 'ESC_V2/hardware_u1/**'
      - 'ESC_V2/hardware_b1/**'
      - '.github/workflows/kicad-u1-verify.yml'
  workflow_dispatch:

jobs:
  verify-scaffold:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Run repository anti-hallucination scaffold checker
        run: python3 ESC_V2/hardware_u1_scaffold/verify_u1_scaffold.py

      - name: Install supported KiCad 10 CLI
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --install-recommends kicad
          kicad-cli --version | tee /tmp/kicad-version.txt

      - name: Parse/export scaffold through KiCad CLI
        run: |
          mkdir -p verification/kicad_u1
          cp /tmp/kicad-version.txt verification/kicad_u1/KICAD_VERSION.txt
          kicad-cli sch export netlist \
            -o verification/kicad_u1/ESC_U1_SCAFFOLD.net \
            ESC_V2/hardware_u1_scaffold/ESC_U1_SCAFFOLD.kicad_sch
          test -s verification/kicad_u1/ESC_U1_SCAFFOLD.net

      - name: Run ERC and retain report
        run: |
          kicad-cli sch erc \
            -o verification/kicad_u1/ERC.rpt \
            ESC_V2/hardware_u1_scaffold/ESC_U1_SCAFFOLD.kicad_sch
          cat verification/kicad_u1/ERC.rpt

      - name: Upload KiCad verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-u1-verification
          path: verification/kicad_u1/
          if-no-files-found: warn

  audit-legacy-b1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install supported KiCad 10 CLI
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --install-recommends kicad
          mkdir -p verification/kicad_b1
          kicad-cli --version | tee verification/kicad_b1/KICAD_VERSION.txt

      - name: Audit legacy B1 parser and netlist without modifying source
        run: |
          set +e
          kicad-cli sch export netlist \
            -o verification/kicad_b1/ESC_3kW_B1.net \
            ESC_V2/hardware_b1/ESC_3kW_B1.kicad_sch \
            >verification/kicad_b1/NETLIST_STDOUT.txt \
            2>verification/kicad_b1/NETLIST_STDERR.txt
          rc=$?
          set -e
          echo "$rc" | tee verification/kicad_b1/NETLIST_EXIT_CODE.txt
          cat verification/kicad_b1/NETLIST_STDOUT.txt || true
          cat verification/kicad_b1/NETLIST_STDERR.txt || true
          if [ -s verification/kicad_b1/ESC_3kW_B1.net ]; then
            echo "NETLIST_NONEMPTY=1" | tee -a verification/kicad_b1/SUMMARY.txt
          else
            echo "NETLIST_NONEMPTY=0" | tee -a verification/kicad_b1/SUMMARY.txt
          fi
          echo "NETLIST_EXIT_CODE=$rc" | tee -a verification/kicad_b1/SUMMARY.txt

      - name: Capture legacy B1 ERC as migration evidence
        run: |
          set +e
          kicad-cli sch erc \
            -o verification/kicad_b1/ERC.rpt \
            ESC_V2/hardware_b1/ESC_3kW_B1.kicad_sch \
            >verification/kicad_b1/ERC_STDOUT.txt \
            2>verification/kicad_b1/ERC_STDERR.txt
          rc=$?
          set -e
          echo "$rc" | tee verification/kicad_b1/ERC_EXIT_CODE.txt
          cat verification/kicad_b1/ERC_STDOUT.txt || true
          cat verification/kicad_b1/ERC_STDERR.txt || true
          cat verification/kicad_b1/ERC.rpt || true
          echo "ERC_EXIT_CODE=$rc" | tee -a verification/kicad_b1/SUMMARY.txt
          echo "B1_AUDIT_ONLY=1" | tee -a verification/kicad_b1/SUMMARY.txt
          echo "NOTE=Legacy B1 pass/fail is migration evidence only and does not qualify U1." | tee -a verification/kicad_b1/SUMMARY.txt

      - name: Upload legacy B1 KiCad baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-b1-baseline-audit
          path: verification/kicad_b1/
          if-no-files-found: warn
